name: Pull Request

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
      # setup-node installs volta.node but ships the npm bundled with Node. The
      # allowScripts deny-list is only enforced by npm 12, so pin volta.npm too.
      - name: Pin npm to the version in package.json
        run: |
          npm install -g --ignore-scripts "npm@$(node -p 'require("./package.json").volta.npm')"
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1