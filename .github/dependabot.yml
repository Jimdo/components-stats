version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '05:30'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 99
    versioning-strategy: 'increase'
    ignore:
      # react-scanner loads @typescript-eslint/typescript-estree, which needs
      # the JavaScript TypeScript API. typescript@7 ships only a launcher for
      # the native compiler, so a major bump breaks `npm start` at runtime.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    cooldown:
      default-days: 3
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      commitizen:
        patterns:
          - '@ryansonshine/*'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
