version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '05:30'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 99
    versioning-strategy: 'increase'
    ignore:
      # Pinned to react-scanner's own typescript pin so the two dedupe into a
      # single bundled copy. Any bump, including a patch, splits them and
      # doubles the published tarball. Bump it when react-scanner moves.
      - dependency-name: 'typescript'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    cooldown:
      default-days: 3
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      commitizen:
        patterns:
          - '@ryansonshine/*'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
